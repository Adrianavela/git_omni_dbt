# Reference this view as users
schema: fashionly

dimensions:
  age: {}
  city: {}
  country: {}
  email: {}
  first_name: {}
  gender: {}
  last_name: {}
  latitude: {}
  longitude: {}
  postal_code: {}
  state: {}
  street_address: {}
  traffic_source: {}

  created_time:
    timeframe_metadata:
      date:
        format: "%Y-%m-%d"
      week:
        format: "%Y' %U" #"%b-%d"
      month:
        format: "%Y-%m"

  id:
    format: ID
    primary_key: true

measures:
  count:
    aggregate_type: count
