# Reference this view as inventory_items
schema: fashionly

dimensions:
  cost: {}
  product_brand: {}
  product_category: {}
  product_department: {}
  product_name: {}
  product_retail_price: {}
  product_sku: {}
  sold_time: {}

  created_time:
    timeframe_metadata:
      date:
        format: "%Y-%m-%d"
      week:
        format: "%Y' %U" #"%b-%d"
      month:
        format: "%Y-%m"

  id:
    format: ID
    primary_key: true

  product_distribution_center_id:
    format: ID

  product_id:
    format: ID

measures:
  count:
    aggregate_type: count
