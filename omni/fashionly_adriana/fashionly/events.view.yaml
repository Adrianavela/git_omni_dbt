# Reference this view as events
schema: fashionly

dimensions:
  browser: {}
  city: {}
  event_type: {}
  ip_address: {}
  postal_code: {}
  sequence_number: {}
  state: {}
  traffic_source: {}
  uri: {}

  created_time:
    timeframe_metadata:
      date:
        format: "%Y-%m-%d"
      week:
        format: "%Y' %U" #"%b-%d"
      month:
        format: "%Y-%m"

  id:
    format: ID
    primary_key: true

  session_id:
    format: ID

  user_id:
    format: ID

measures:
  count:
    aggregate_type: count
