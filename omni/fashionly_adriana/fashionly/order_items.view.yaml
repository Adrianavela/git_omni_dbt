# Reference this view as order_items
schema: fashionly

dimensions:
  sale_price: {}

  returned_time:
    sql: DATE (returned_time)

  shipped_time:
    sql: DATE (shipped_time)

  created_time:
    sql: DATE (created_time)

  delivered_time:
    sql: DATE (delivered_time)

  id:
    format: ID
    primary_key: true

  inventory_item_id:
    format: ID

  order_id:
    format: ID

  product_id:
    format: ID

  user_id:
    format: ID

measures:
  count:
    aggregate_type: count

  sale_price_sum:
    sql: ${order_items.sale_price}
    aggregate_type: sum
