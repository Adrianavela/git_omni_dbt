# Reference this view as order_items
schema: fashionly

dimensions:
  delivered_time: {}
  returned_time: {}
  sale_price: {}
  shipped_time: {}

  created_time:
    timeframe_metadata:
      date:
        format: "%Y-%m-%d"
      week:
        format: "%Y' %U" #"%b-%d"
      month:
        format: "%Y-%m"

  id:
    format: ID
    primary_key: true

  inventory_item_id:
    format: ID

  order_id:
    format: ID

  product_id:
    format: ID

  user_id:
    format: ID

measures:
  count:
    aggregate_type: count

  sale_price_sum:
    sql: ${order_items.sale_price}
    aggregate_type: sum
